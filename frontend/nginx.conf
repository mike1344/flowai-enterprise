# 单容器同时承担静态前端与同源反向代理（docs/01 §2：/api/flowai -> flowai-api）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # 透传/生成 Trace ID：客户端未提供时由后端生成（docs/04 §1）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Trace-ID $http_x_trace_id;

    # 容器重建后 IP 会变：改用 Docker 内置 DNS 动态解析，避免 nginx 缓存旧地址导致 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $flowai_upstream http://flowai-api:8001;
    set $industrial_upstream http://industrial-api:8002;

    location /api/flowai/ {
        rewrite ^/api/flowai/(.*)$ /api/v1/$1 break;
        proxy_pass $flowai_upstream;
        proxy_read_timeout 60s;
    }

    location /api/industrial/ {
        rewrite ^/api/industrial/(.*)$ /api/v1/$1 break;
        proxy_pass $industrial_upstream;
        proxy_read_timeout 60s;
    }

    # 带 hash 的静态资源可长期缓存（文件名随内容变化）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 绝不缓存：否则升级后浏览器仍加载旧的 hash 入口，出现「旧页面/待开发」假象
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # SPA 路由回退：/admin/*、/apps/:slug/* 均由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }
}