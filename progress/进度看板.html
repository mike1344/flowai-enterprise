const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ids=new Map(()=>[]);function validDone(t){return t.status==='DONE'&&t.evidence.trim()&&t.dependencies.every(d=>{let a=state.tasks.find(x=>x.id===d);return a&&validDone(a)})}function completed(t){return Boolean(validDone(t))}function pct(ts){let all=ts.reduce((s,t)=>s+t.weight,0),done=ts.filter(completed).reduce((s,t)=>s+t.weight,0);return all?100*done/all:0}function bar(p){return `<div class="bar"><div class="fill" style="width:${Math.min(100,p)}%"></div></div>`}function save(){localStorage.setItem(key,JSON.stringify(state));render()}
const phases=[["S0", "基础环境", ["M00"]], ["S1", "工业业务闭环", ["M01"]], ["S2", "平台与知识库", ["M02", "M03"]], ["S3", "Agent业务集成", ["M04"]], ["S4", "前端与P0交付", ["M05", "M06"]], ["S5", "P1增强与交付", ["M07", "M08"]]];
function phaseOf(t){return phases.findIndex(p=>p[2].some(prefix=>t.id.startsWith(prefix)))}
function currentPhase(){let i=phases.findIndex(p=>state.tasks.some(t=>p[2].some(prefix=>t.id.startsWith(prefix))&&!completed(t)));return i<0?phases.length:i}
function phaseReady(t){return phaseOf(t)<=currentPhase()}

function edit(id,field,val){let t=state.tasks.find(t=>t.id===id);if(!t)return;

if(field==='status'&&val==='DOING'&&!t.started_at)t.started_at=new Date().toISOString().slice(0,10);
t[field]=val;if(field==='status'&&val==='DONE'&&!t.finished_at)t.finished_at=new Date().toISOString().slice(0,10);save()}
function renderTable(){let a=state.tasks.filter(t=>(!document.getElementById('stage').value||t.priority===document.getElementById('stage').value)&&(!document.getElementById('filter').value||t.status===document.getElementById('filter').value)&&(`${t.id} ${t.title}`).toLowerCase().includes(document.getElementById('search').value.toLowerCase()));let statuses=['TODO','READY','DOING','BLOCKED','REVIEW','TESTED','DONE'];document.getElementById('taskTable').innerHTML=`<table><thead><tr><th>任务</th><th>阶段/权重</th><th>依赖</th><th>状态</th><th>负责人</th><th>完成日期</th><th>验收证据（必填）</th><th>备注</th></tr></thead><tbody>${a.map(t=>`<tr><td><b>${t.id}</b><br>${esc(t.title)}<br><span class="small">验收：${esc(t.acceptance)}</span></td><td>${t.priority}<br>${t.weight.toFixed(2)}%</td><td>${esc(t.dependencies.join(', ')||'无')}</td><td><select class="narrow" onchange="edit('${t.id}','status',this.value)">${statuses.map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><input class="narrow" value="${esc(t.owner)}" onchange="edit('${t.id}','owner',this.value)" placeholder="负责人"></td><td><input type="date" value="${esc(t.finished_at)}" onchange="edit('${t.id}','finished_at',this.value)"></td><td><input class="wide" value="${esc(t.evidence)}" onchange="edit('${t.id}','evidence',this.value)" placeholder="测试报告/提交链接"></td><td><input class="wide" value="${esc(t.notes)}" onchange="edit('${t.id}','notes',this.value)" placeholder="风险/阻塞/进展"></td></tr>`).join('')}</tbody></table>`;document.getElementById('notice').textContent=`显示 ${a.length} / ${state.tasks.length} 项任务。TESTED 和 DOING 不计完成率；每次导出后请提交到版本库。`}
function exportJSON(){state.updated_at=new Date().toISOString();let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='任务进度.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importJSON(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let s=JSON.parse(r.result);if(!Array.isArray(s.tasks)||s.tasks.length!==baseline.tasks.length||!baseline.tasks.every(t=>s.tasks.some(x=>x.id===t.id)))throw Error('任务集合不匹配');state=s;save();alert('已导入进度记录')}catch(err){alert('导入失败：'+err.message)}};r.readAsText(f);e.target.value=''}function resetView(){if(confirm('确认恢复到全部未完成的初始基线？请先导出当前记录备份。')){state=structuredClone(baseline);save()}}render();</script></body></html>
